name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (reference checks, agent outputs, links)
        run: python -m unittest discover -s tests -v
      - name: Score the committed CRM run against the rules
        run: python tools/reference_check.py crm examples/crm-audit --today 2026-10-13 --against examples/crm-audit/audit-output.md
      - name: Score the committed inventory run against the rules
        run: python tools/reference_check.py inventory examples/sample-run --against examples/sample-run/proposal-queue-output.md
